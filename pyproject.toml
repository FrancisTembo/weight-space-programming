[project]
name = "wsp"
version = "0.1.0"
description = "Can a published weight edit be found from a model's weights alone?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "torch==2.14.1",
    "transformers==5.23.0",
    "safetensors",
    "huggingface_hub",
    "matplotlib",
    "nbconvert",
    "nbformat",
    "ipykernel",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wsp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the 1.75 GB base model in the Hugging Face cache"]
